<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ثبت‌نام — دوپامین</title>
  <meta name="description" content="ساخت حساب کاربری در دوپامین — آزمون‌ها، مشاوره و خدمات آموزشی.">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body data-page="register">
  <a class="skip-link" href="#main">پرش به محتوای اصلی</a>
  <main id="main">
    <div class="auth-shell">
      <form class="auth-card" data-demo novalidate data-reveal>
        <img class="logo-mark" src="assets/img/logo.png" alt="لوگوی دوپامین" width="203" height="59">
        <div style="display:grid;gap:6px">
          <h1>ساخت حساب کاربری</h1>
          <p class="hint-line">با حساب کاربری، نتایج آزمون‌ها و درخواست‌های مشاوره‌ات یک‌جا ذخیره می‌شود.</p>
        </div>
        <div class="field">
          <label for="rg-name">نام و نام خانوادگی</label>
          <input class="input" id="rg-name" type="text" placeholder="نام شما" required>
          <span class="err-msg">نام خود را وارد کنید.</span>
        </div>
        <div class="field">
          <label for="rg-mail">ایمیل</label>
          <input class="input" id="rg-mail" type="email" placeholder="example@mail.com" required>
          <span class="err-msg">ایمیل معتبر وارد کنید.</span>
        </div>
        <div class="field">
          <label for="rg-phone">شمارهٔ موبایل</label>
          <input class="input" id="rg-phone" type="tel" placeholder="۰۹۱۲۳۴۵۶۷۸۹" required>
          <span class="err-msg">شمارهٔ موبایل معتبر وارد کنید.</span>
        </div>
        <div class="field">
          <label for="rg-pass">رمز عبور</label>
          <input class="input" id="rg-pass" type="password" placeholder="حداقل ۶ کاراکتر" required minlength="6">
          <span class="err-msg">رمز عبور حداقل ۶ کاراکتر باشد.</span>
        </div>
        <label class="check">
          <input type="checkbox" required checked>
          <span class="box"><i data-lucide="check" class="icon"></i></span>
          <span class="small">قوانین و مقررات دوپامین را می‌پذیرم.</span>
        </label>
        <button class="btn btn--primary btn--lg" type="submit">ثبت‌نام <i data-lucide="arrow-left" class="icon icon--arrow"></i></button>
        <p class="alt-action">قبلاً ثبت‌نام کرده‌ای؟ <a href="login.html">وارد شو</a></p>
      </form>
    </div>
  </main>
  <script src="assets/vendor/gsap.min.js" defer></script>
  <script src="assets/vendor/ScrollTrigger.min.js" defer></script>
  <script src="assets/vendor/lenis.min.js" defer></script>
  <script src="assets/vendor/lucide.min.js" defer></script>
  <script src="assets/js/data/site.js" defer></script>
  <script src="assets/js/app.js" defer></script>
</body>
</html>
